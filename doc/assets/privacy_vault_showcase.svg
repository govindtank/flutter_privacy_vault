    <path d="M24 12 L36 17 V26 C36 33.5 30.8 38.5 24 41 C17.2 38.5 12 33.5 12 26 V17 Z" fill="none" stroke="#10B981" stroke-width="2.5" />
    <path d="M20 25.5 L22.5 28 L28 22.5" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

