        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B">4. ADDRESS (STREET &amp; PREMISE)</text>
        <text x="14" y="40" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#DDD6FE">Flat ***, ***************, Bengaluru 560***</text>
