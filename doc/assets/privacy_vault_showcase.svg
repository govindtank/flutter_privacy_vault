        <text x="14" y="40" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FCD34D">g********k@hdfcbank.com</text>
        <rect x="360" y="14" width="56" height="22" rx="6" fill="#10B981" fill-opacity="0.15" />
        <text x="388" y="29" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#34D399">MASKED</text>
