        <text x="27.5" y="22" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#F8FAFC">7</text>
        <rect x="65" y="0" width="55" height="34" rx="6" fill="#1E293B" />
        <text x="92.5" y="22" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#F8FAFC">2</text>
        <rect x="130" y="0" width="55" height="34" rx="6" fill="#1E293B" />
        <text x="157.5" y="22" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#F8FAFC">9</text>

        <rect x="0" y="42" width="55" height="34" rx="6" fill="#1E293B" />
        <text x="27.5" y="64" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#F8FAFC">1</text>
        <rect x="65" y="42" width="55" height="34" rx="6" fill="#1E293B" />
        <text x="92.5" y="64" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#F8FAFC">8</text>
        <rect x="130" y="42" width="55" height="34" rx="6" fill="#1E293B" />
        <text x="157.5" y="64" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#F8FAFC">4</text>

        <rect x="0" y="84" width="55" height="34" rx="6" fill="#1E293B" />
        <text x="27.5" y="106" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#F8FAFC">3</text>
        <rect x="65" y="84" width="55" height="34" rx="6" fill="#1E293B" />
        <text x="92.5" y="106" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#F8FAFC">0</text>
        <rect x="130" y="84" width="55" height="34" rx="6" fill="#1E293B" />
        <text x="157.5" y="106" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#F8FAFC">5</text>
